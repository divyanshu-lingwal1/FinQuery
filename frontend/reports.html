<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinQuery - Reports</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Financial Reports</h1>

        <p>View a summary of your financial transactions.</p>

        <div class="dashboard-cards">

            <div class="card">
                <h3>Total Spending</h3>
                <p id="reportTotal">₹0</p>
            </div>

            <div class="card">
                <h3>Total Transactions</h3>
                <p id="reportTransactions">0</p>
            </div>

            <div class="card">
                <h3>Highest Expense</h3>
                <p id="reportHighest">₹0</p>
            </div>

            <div class="card">
                <h3>Average Expense</h3>
                <p id="reportAverage">₹0</p>
            </div>

        </div>

        <h2>Transaction Report</h2>
        
        <button id="exportReport">Export CSV</button>

        <table class="transaction-table">

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>
            </thead>

            <tbody id="reportTransactionsList">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
